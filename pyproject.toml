[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dai-lmapf-research"
version = "0.0.1"
description = "Official implementation and reproducibility artifact for the DAI 2026 Oral paper: Budgeted Guidance Refresh Control for Lifelong Multi-Agent Path Finding."
requires-python = ">=3.9"

[project.optional-dependencies]
experiment = ["numpy", "torch"]
figures = ["reportlab"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
