name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, minimal dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run portable tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v
        env:
          # Skip tests that require torch/OnlineGGO by default
          CARR_SKIP_HEAVY_TESTS: "1"

      - name: Run compact analysis (stdlib only)
        run: |
          python scripts/analyze_compact_b.py --output /tmp/compact_b_analysis.json --force
          echo "✅ Compact analysis completed successfully"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile src/dai_lmapf/*.py
          python -m py_compile scripts/*.py
          python -m py_compile tests/*.py
          echo "✅ All Python files have valid syntax"
